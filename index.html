<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucapan Idul Fitri</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  color: white;
}

/* Container */
.container {
  width: 100%;
  max-width: 360px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  animation: fadeIn 0.6s ease;
}

/* Foto */
.foto {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 15px;
  border: 3px solid #00c9a7;
}

/* Icon */
.icon {
  font-size: 40px;
  margin-bottom: 10px;
}

/* Text */
h1 {
  font-size: 18px;
  margin-bottom: 10px;
}

p {
  font-size: 14px;
  opacity: 0.9;
}

/* Input */
input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
  border-radius: 10px;
  border: none;
  outline: none;
  text-align: center;
}

/* Button */
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #00c9a7;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* Hidden */
.hidden {
  display: none;
}

/* Animasi */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="container" id="page1">
  <div class="icon">🌙</div>
  <h1>Selamat Datang</h1>
  <p>Masukkan nama kamu</p>
  <input type="text" id="nama" placeholder="Nama kamu">
  <button onclick="lanjut()">Lanjut</button>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
  
  <!-- FOTO KAMU -->
  <img src="foto.jpg" class="foto">

  <div class="icon">🕌</div>
  <h1>Selamat Hari Raya Idul Fitri</h1>
  <p id="ucapanText"></p>
  <p><b>Mohon maaf lahir dan batin 🙏</b></p>

</div>

<script>
function lanjut() {
  const nama = document.getElementById("nama").value;

  if(nama.trim() === "") {
    alert("Isi nama dulu ya 😄");
    return;
  }

  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");

  document.getElementById("ucapanText").innerHTML =
    "Halo <b>" + nama + "</b>, semoga di hari yang fitri ini kamu selalu diberi kebahagiaan 🤲✨";
}
</script>

</body>
</html>
